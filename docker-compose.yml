x-ingestion-worker: &ingestion-worker
  image: diel-ingestion-worker
  build:
    context: .
    dockerfile: apps/ingestion-worker/Dockerfile
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
    minio:
      condition: service_started
    emqx:
      condition: service_started
  environment:
    DATABASE_URL: postgres://${POSTGRES_USER:-diel}:${POSTGRES_PASSWORD:-change-me}@timescaledb:5432/${POSTGRES_DB:-diel}
    REDIS_URL: redis://redis:6379
    MQTT_URL: mqtt://emqx:1883
    MQTT_CLIENT_ID: ${MQTT_CLIENT_ID:-ingestion-worker-2}
    MQTT_SHARE_GROUP: ${MQTT_SHARE_GROUP:-ingestion}
    REDIS_STREAM_KEY: ${REDIS_STREAM_KEY:-telemetry:stream}
    REDIS_CONSUMER_GROUP: ${REDIS_CONSUMER_GROUP:-telemetry_cg}
    MINIO_ENDPOINT: http://minio:9000
    MINIO_ROOT_USER: ${MINIO_ROOT_USER:-change-me}
    MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me}
    MINIO_BUCKET: ${MINIO_BUCKET:-diel-raw-telemetry}
    WORKER_PORT: 3002
    UV_THREADPOOL_SIZE: 16
    INGEST_CONCURRENCY: ${INGEST_CONCURRENCY:-8}
    INGEST_CONCURRENCY_PEAK: ${INGEST_CONCURRENCY_PEAK:-32}
    WORKER_TEST_HOOKS: "1"
    OPEN_METEO_ARCHIVE_URL: ${OPEN_METEO_ARCHIVE_URL:-https://archive-api.open-meteo.com/v1/archive}
  volumes:
    - ./data:/repo/data:ro

services:
  timescaledb:
    image: timescale/timescaledb:2.21.3-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-diel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-diel}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-diel} -d ${POSTGRES_DB:-diel}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/tmp/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-change-me}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me}

  emqx:
    image: emqx/emqx:5.8.6
    environment:
      EMQX_MQTT__MAX_MQUEUE_LEN: "200000"
      EMQX_MQTT__MAX_INFLIGHT: "100"
      EMQX_FORCE_SHUTDOWN__ENABLE: "false"
      EMQX_FORCE_SHUTDOWN__MAX_MESSAGE_QUEUE_LEN: "200000"
      EMQX_FORCE_SHUTDOWN__MAX_HEAP_SIZE: "512MB"

  migrate:
    image: timescale/timescaledb:2.21.3-pg16
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      PGHOST: timescaledb
      PGUSER: ${POSTGRES_USER:-diel}
      PGPASSWORD: ${POSTGRES_PASSWORD:-change-me}
      PGDATABASE: ${POSTGRES_DB:-diel}
    volumes:
      - ./db/migrations:/migrations:ro
      - ./db/migrate.sh:/migrate.sh:ro
      - ./db/seed/fixtures.sql:/seed/fixtures.sql:ro
    entrypoint: ["sh", "/migrate.sh"]
    restart: "no"

  api-server:
    build:
      context: .
      dockerfile: apps/api-server/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-diel}:${POSTGRES_PASSWORD:-change-me}@timescaledb:5432/${POSTGRES_DB:-diel}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me}
      API_PORT: 3000
    ports:
      - "${API_PORT:-3000}:3000"

  ingestion-worker:
    <<: *ingestion-worker
    ports:
      - "${WORKER_PORT:-3002}:3002"

  ingestion-worker-2:
    <<: *ingestion-worker

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      - api-server
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-3000}
      API_INTERNAL_URL: http://api-server:3000
    ports:
      - "${WEB_PORT:-3001}:3001"

  simulator:
    build:
      context: .
      dockerfile: apps/simulator/Dockerfile
    depends_on:
      - ingestion-worker
      - emqx
    environment:
      MQTT_URL: mqtt://emqx:1883
      TELEMETRY_FILE: ${TELEMETRY_FILE:-/repo/data/telemetrias.jsonl}

  prometheus:
    image: prom/prometheus:v3.2.1
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  loki:
    image: grafana/loki:3.4.2
    command: ["-config.file=/etc/loki/local-config.yaml"]

  promtail:
    image: grafana/promtail:3.4.2
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./deploy/observability/promtail.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
      POSTGRES_USER: ${POSTGRES_USER:-diel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-diel}
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "3003:3000"
    depends_on:
      - prometheus
      - loki
      - timescaledb

  unit-tests:
    image: node:22-alpine
    working_dir: /repo
    volumes:
      - .:/repo
    command: ["sh", "-c", "npm test --workspace api-server && npm test --workspace web && npm test --workspace ingestion-worker"]
    profiles: ["test"]

  e2e-tests:
    image: node:22-alpine
    working_dir: /repo
    depends_on:
      api-server:
        condition: service_started
      ingestion-worker:
        condition: service_started
      web:
        condition: service_started
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-diel}:${POSTGRES_PASSWORD:-change-me}@timescaledb:5432/${POSTGRES_DB:-diel}
      API_BASE_URL: http://api-server:3000
      WEB_BASE_URL: http://web:3001
      REDIS_URL: redis://redis:6379
      MQTT_URL: mqtt://emqx:1883
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-change-me}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me}
      MINIO_BUCKET: ${MINIO_BUCKET:-diel-raw-telemetry}
      WORKER_BASE_URL: http://ingestion-worker:3002
      JWT_SECRET: ${JWT_SECRET:-change-me}
    volumes:
      - .:/repo
      - e2e-modules:/repo/node_modules
    command: ["sh", "-c", "npm install --workspace api-server && npm install --workspace web && npm install --workspace ingestion-worker && npm run test:e2e --workspace api-server && npm run test:e2e --workspace web && npm run test:e2e --workspace ingestion-worker"]
    profiles: ["test"]

  ui-tests:
    image: mcr.microsoft.com/playwright:v1.49.1-jammy
    ipc: host
    working_dir: /repo
    depends_on:
      - web
      - api-server
    environment:
      WEB_BASE_URL: http://web:3001
      API_BASE_URL: http://api-server:3000
    volumes:
      - .:/repo
      - ui-modules:/repo/node_modules
    command: ["sh", "-c", "npm install --workspace web && npx playwright test --config=apps/web/playwright.config.ts"]
    profiles: ["test"]

volumes:
  redis-data:
  e2e-modules:
  ui-modules:
